{%- assign items = include.items | default: page.faq -%}
{%- if items and items.size > 0 -%}
{%- assign faq_title = include.title | default: 'Preguntas frecuentes' -%}

<section class="faq-section" aria-labelledby="faq-title">
  <div class="section-kicker">Dudas habituales</div>
  <h2 id="faq-title">{{ faq_title }}</h2>
  <div class="faq-list">
    {%- for item in items -%}
    <details class="faq-item">
      <summary class="faq-question">{{ item.q }}</summary>
      <div class="faq-answer">{{ item.a | markdownify }}</div>
    </details>
    {%- endfor -%}
  </div>
</section>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {%- for item in items -%}
    {
      "@type": "Question",
      "name": {{ item.q | strip | jsonify }},
      "acceptedAnswer": {
        "@type": "Answer",
        "text": {{ item.a | markdownify | strip_html | strip_newlines | strip | jsonify }}
      }
    }{%- unless forloop.last -%},{%- endunless -%}
    {%- endfor -%}
  ]
}
</script>
{%- endif -%}
